[package]
name = "openapi-lsp"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
ureq = { version = "3", features = ["platform-verifier"] }
anyhow = "1"
crossbeam-channel = "0.5"

[profile.release]
strip = true
lto = "thin"
